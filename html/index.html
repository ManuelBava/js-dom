<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-dom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/JS/app.js" defer></script>
</head>

<body class="js-dom-body">
    <main>
        <div class="container text-center my-5">
            <h1 class="text-white mb-4">CALCOLA IL PREZZO DEL TUO BIGLIETTO</h1>
            <div class="row row-cols-1">
                <div class="col">
                    <div class="card text-center">
                        <form class="my-3 mx-4" action="" id="form">
                            <div class="row g-3 inputs">
                                <div class="col-12 col-md-4">
                                    <label for="fullName" class="form-label">Nome e Cognome</label>
                                    <input class="form-control" id="fullName" type="text"
                                        placeholder="Inserisci il tuo nome" required>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="km" class="form-label">Km da percorrere</label>
                                    <input class="form-control" id="km" type="number" placeholder="Inserisci i km" min="1" required>
                                </div>
                                <div class="col-12 col-md-4">
                                    <label for="age" class="form-label">Fascia d'età</label>
                                    <select class="form-select" name="age" id="age" required>
                                        <option value="Maggiorenne">Maggiorenne</option>
                                        <option value="Minorenne">Minorenne</option>
                                        <option value="Over 65">Over 65</option>
                                    </select>
                                </div>
                            </div>
                            <div class="my-4 d-flex justify-content-center align-items-center gap-3">
                                <input class="btn btn-primary" type="submit" value="Genera">
                                <button type="button" class="btn btn-danger">Annulla</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div id="ticketCard" class="my-4 row row-cols-1 d-none">
                <h2 class="text-white my-4">IL TUO BIGLIETTO</h2>
                <div class="col">
                    <div class="card">
                        <h3 class="card-header text-start fw-bold fs-4">Dettaglio Passeggeri:</h3>
                        <div class="card-body">
                            <div class="d-flex flex-column flex-md-row justify-content-around align-items-center gap-3 py-2 text-start">
                                <div>
                                    <h6 class="fw-bold mb-1">Nome Passeggero</h6>
                                    <h5 id="nomePasseggero" class="mb-0 text-primary"></h5>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1">Offerta</h6>
                                    <p id="offerta" class="mb-0"></p>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1">Carrozza</h6>
                                    <p id="carrozza" class="mb-0"></p>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1">Codice CP</h6>
                                    <p id="codiceCP" class="mb-0"></p>
                                </div>
                                <div>
                                    <h6 class="fw-bold mb-1">Costo biglietto</h6>
                                    <p id="ticketPrice" class="mb-0 fw-bold"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
